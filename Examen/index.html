<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de produccion</title>
</head>
<body>
    <h1>Simulador de produccion por lotes</h1>

    <label for="producto">
        Producto :
    </label>

    <select id="producto">
        <option value="">Seleccione</option>
        <option value="a">Producto A</option>
        <option value="b">Producto B</option>
        <option value="c">Producto C</option>
    </select>

    <br /><br />

    <label for="lotes">
        Cantidad de lotes:
    </label>

    <input id="lotes" type="number" min="1" max="20"/>

    <br /><br />

    <button id="calcular">Simular produccion</button>
    
    <h2>Resultado</h2>

    <p id="mensaje"></p>
    <p id="resumen"></p>

    <div id="detalle"></div>

    <script src="js/app.js"></script>
</body>
</html>

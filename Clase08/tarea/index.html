<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Producción - Alumbrados Navideños</title>
</head>
<body>

    <div>
        <h2>Simulación de Producción de Alumbrados Navideños</h2>
        
        <div>
            <label for="producto">Tipo de artículo navideño:</label>
            <select id="producto">
                <option value="figura">Figura Monumental (Costo base: $1,500,000 COP/lote)</option>
                <option value="manguera">Rollo de Manguera LED (Costo base: $350,000 COP/lote)</option>
                <option value="cascada">Cortina / Cascada de Luces (Costo base: $180,000 COP/lote)</option>
            </select>
        </div>

        <div>
            <label for="lotes">Cantidad de lotes:</label>
            <input type="number" id="lotes" min="1">
        </div>

        <button id="btnSimular">Simular Producción</button>

        <div id="reporte"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
